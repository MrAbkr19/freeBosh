<header class="topbar">
  <div class="brand-group">
    <div class="logo-box">
      <img src="icons/Asset 2.png" alt="FreeBosh Logo" class="logo-img" />
    </div>
    <h1 class="brand">FreeBosh</h1>
  </div>
  <div class="status-group">
    <div class="status-pill" [class.status-pill--offline]="!connectivity.isOnline()">
      <span class="status-dot" [class.status-dot--offline]="!connectivity.isOnline()"></span>
      <span>{{ connectivity.isOnline() ? 'En ligne' : 'Hors ligne' }}</span>
    </div>
    <button class="status-btn" type="button" aria-label="Statut connexion">
      <span class="material-symbols-outlined">
        {{ connectivity.isOnline() ? 'wifi' : 'wifi_off' }}
      </span>
    </button>
  </div>
</header>

<aside class="sidebar">
  <a class="sidebar-link" routerLink="/etudiant/accueil" routerLinkActive="sidebar-link--active">
    <span class="material-symbols-outlined">home</span>
    Accueil
  </a>
  <a class="sidebar-link" routerLink="/etudiant/modules" routerLinkActive="sidebar-link--active">
    <span class="material-symbols-outlined">account_tree</span>
    Modules
  </a>
  <a class="sidebar-link" routerLink="/etudiant/bibliotheque" routerLinkActive="sidebar-link--active">
    <span class="material-symbols-outlined">description</span>
    Bibliothèque
  </a>
  <a class="sidebar-link" routerLink="/etudiant/profil" routerLinkActive="sidebar-link--active">
    <span class="material-symbols-outlined">person</span>
    Profil
  </a>
</aside>

<main class="content-area">
  <router-outlet></router-outlet>
</main>

<nav class="bottom-nav">
  <a class="nav-btn" routerLink="/etudiant/accueil" routerLinkActive="nav-btn--active">
    <span class="material-symbols-outlined">home</span>
    <span>Accueil</span>
  </a>
  <a class="nav-btn" routerLink="/etudiant/modules" routerLinkActive="nav-btn--active">
    <span class="material-symbols-outlined">account_tree</span>
    <span>Modules</span>
  </a>
  <a class="nav-btn" routerLink="/etudiant/bibliotheque" routerLinkActive="nav-btn--active">
    <span class="material-symbols-outlined">description</span>
    <span>Bibliothèque</span>
  </a>
  <a class="nav-btn" routerLink="/etudiant/profil" routerLinkActive="nav-btn--active">
    <span class="material-symbols-outlined">person</span>
    <span>Profil</span>
  </a>
</nav>
